name: ci

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  default-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up environment
        run: uv sync --all-extras --all-groups

      - name: Run tests
        run: uv run pytest --disable-warnings --cov --cov-report json tests/
